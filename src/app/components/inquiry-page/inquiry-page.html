<section id="contact" class="py-16 sm:py-24 px-4 sm:px-6 lg:px-8 bg-[#FDFCF5]">
  <div class="max-w-7xl mx-auto">

    <div class="text-center max-w-2xl mx-auto mb-12">
      <h2 class="font-serif text-3xl sm:text-4xl text-[#4B3621] mb-3">Get In Touch</h2>
      <p class="text-sm sm:text-base text-[#333333]/75">
        Connect with our team to purchase coffee, request market intelligence, or explore partnership opportunities.
      </p>
    </div>

    <!-- Outer Split: Image Left, Form Right (Stacked below 1024px) -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-stretch">

      <!-- Left Photo & Checklist Card -->
      <div class="bg-white rounded-2xl border border-[#4B3621]/10 overflow-hidden flex flex-col">
        <img
          src="/Images/Trade-Policies.jpg"
          alt="Coffee trade consultation"
          class="w-full h-64 sm:h-80 object-cover"
        />
        <div class="p-6 sm:p-8 flex-1">
          <h3 class="font-serif text-xl text-[#4B3621] mb-4">Our Services</h3>
          <ul class="space-y-3 text-sm text-[#333333]/80">
            <!-- Keep your existing checkmark list items here -->
          </ul>
        </div>
      </div>

      <!-- Right Inquiry Form Card -->
      <div class="bg-white rounded-2xl border border-[#4B3621]/10 p-6 sm:p-8 shadow-xs">
        <form (ngSubmit)="onSubmit()" class="space-y-5">

          <!-- Row 1: Full Name & Company -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-[#4B3621] mb-1.5">Full Name *</label>
              <input type="text" required class="w-full px-3.5 py-2.5 rounded-lg border border-[#4B3621]/20 focus:outline-none focus:border-[#2E7D32] text-sm" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-[#4B3621] mb-1.5">Company / Organization</label>
              <input type="text" class="w-full px-3.5 py-2.5 rounded-lg border border-[#4B3621]/20 focus:outline-none focus:border-[#2E7D32] text-sm" />
            </div>
          </div>

          <!-- Row 2: Country & Role -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-[#4B3621] mb-1.5">Country *</label>
              <input type="text" required class="w-full px-3.5 py-2.5 rounded-lg border border-[#4B3621]/20 focus:outline-none focus:border-[#2E7D32] text-sm" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-[#4B3621] mb-1.5">Role *</label>
              <select class="w-full px-3.5 py-2.5 rounded-lg border border-[#4B3621]/20 focus:outline-none focus:border-[#2E7D32] text-sm bg-white">
                <!-- Keep your existing role options -->
              </select>
            </div>
          </div>

          <!-- Row 3: Type of Coffee & Volume -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-[#4B3621] mb-1.5">Type of Coffee *</label>
              <select class="w-full px-3.5 py-2.5 rounded-lg border border-[#4B3621]/20 focus:outline-none focus:border-[#2E7D32] text-sm bg-white">
                <!-- Keep your existing coffee type options -->
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-[#4B3621] mb-1.5">Volume (Bags) *</label>
              <input type="text" required class="w-full px-3.5 py-2.5 rounded-lg border border-[#4B3621]/20 focus:outline-none focus:border-[#2E7D32] text-sm" />
            </div>
          </div>

          <!-- Row 4: Preferred Grade & Delivery Period -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-[#4B3621] mb-1.5">Preferred Grade *</label>
              <select class="w-full px-3.5 py-2.5 rounded-lg border border-[#4B3621]/20 focus:outline-none focus:border-[#2E7D32] text-sm bg-white">
                <!-- Keep your existing grade options -->
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-[#4B3621] mb-1.5">Delivery Period *</label>
              <input type="text" required class="w-full px-3.5 py-2.5 rounded-lg border border-[#4B3621]/20 focus:outline-none focus:border-[#2E7D32] text-sm" />
            </div>
          </div>

          <!-- Additional Notes -->
          <div>
            <label class="block text-xs font-semibold text-[#4B3621] mb-1.5">Additional Notes</label>
            <textarea rows="3" class="w-full px-3.5 py-2.5 rounded-lg border border-[#4B3621]/20 focus:outline-none focus:border-[#2E7D32] text-sm"></textarea>
          </div>

          <button
            type="submit"
            class="btn-feedback w-full py-3 rounded-lg bg-[#2E7D32] hover:bg-[#256628] text-white font-medium text-sm sm:text-base">
            Submit Inquiry
          </button>

        </form>
      </div>

    </div>
  </div>
</section>

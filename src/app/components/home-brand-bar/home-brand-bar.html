<div class="sticky top-0 z-30 bg-[#FDFCF5]/95 backdrop-blur-md border-b border-[#4B3621]/10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
        <!-- Brand Logo + Name Home Button -->
        <a
          routerLink="/"
          class="inline-flex items-center gap-3 group py-1.5 pr-3 rounded-xl hover:bg-[#4B3621]/5 transition-colors">
          <img
            src="/logo.jpeg"
            alt="Kilimo Coffee"
            class="w-9 h-9 rounded-xl object-cover border border-[#4B3621]/20 shadow-2xs group-hover:scale-105 transition-transform"
          />
          <div class="flex flex-col">
            <span class="font-serif text-lg sm:text-xl font-bold text-[#4B3621] leading-none">
              Kilimo Coffee
            </span>
          </div>
        </a>

        <!-- Quick Contextual Links -->
        <div class="flex items-center gap-2 sm:gap-3">
          @if (currentPage !== 'news') {
            <a
              routerLink="/all-news"
              class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium text-[#4B3621] hover:bg-[#4B3621]/5 transition-colors">
              Market News
            </a>
          }
          @if (currentPage !== 'shop') {
            <a
              routerLink="/purchase-coffee"
              class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-[#2E7D32] hover:bg-[#256628] text-white text-xs sm:text-sm font-semibold transition-colors">
              <span>Shop Coffee</span>
              @if (cart.totalItems() > 0) {
                <span class="px-1.5 py-0.5 rounded-full bg-white text-[#2E7D32] text-[10px] font-bold">
                  {{ cart.totalItems() }}
                </span>
              }
            </a>
          }
        </div>
      </div>
    </div>

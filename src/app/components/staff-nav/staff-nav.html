<div class="bg-[#4B3621] text-white border-b border-white/10 px-4 sm:px-6 lg:px-8 py-3">
  <div class="max-w-7xl mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-3">
    <!-- Workspace Navigation Links -->
    <div class="flex flex-wrap items-center gap-2">
      @if (auth.hasRole('journalist', 'admin')) {
        <a
          routerLink="/post-news"
          routerLinkActive="bg-[#2E7D32] text-white shadow-xs"
          class="px-3.5 py-2 rounded-lg text-xs sm:text-sm font-medium text-white/85 hover:text-white hover:bg-white/10 transition-colors">
          Post News
        </a>
      }
      @if (auth.hasRole('delivery', 'admin')) {
        <a
        routerLink="/delivery-orders"
        routerLinkActive="bg-[#2E7D32] text-white shadow-xs"
        class="px-3.5 py-2 rounded-lg text-xs sm:text-sm font-medium text-white/85 hover:text-white hover:bg-white/10 transition-colors">
        Delivery Orders
      </a>
    }
    @if (auth.hasRole('admin')) {
      <a
        routerLink="/admin"
        routerLinkActive="bg-[#2E7D32] text-white shadow-xs"
        class="px-3.5 py-2 rounded-lg text-xs sm:text-sm font-medium text-white/85 hover:text-white hover:bg-white/10 transition-colors">
        Admin Console
      </a>
    }
  </div>
  <!-- Logged-In User Badge & Logout -->
  @if (auth.currentUser(); as user) {
    <div class="flex items-center justify-between sm:justify-end gap-3 text-xs sm:text-sm">
      <span class="text-white/85">
        {{ user.name }}
        <span class="ml-1.5 px-2 py-0.5 rounded-full bg-white/15 text-[11px] uppercase tracking-wider font-semibold">
          {{ user.role }}
        </span>
      </span>

      <button
        type="button"
        (click)="auth.logout()"
        class="px-3 py-1.5 rounded-lg bg-red-600/85 hover:bg-red-600 text-white text-xs font-medium transition-colors cursor-pointer">
        Sign Out
      </button>
    </div>
  }
</div>
</div>

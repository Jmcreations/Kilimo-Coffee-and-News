<section class="min-h-[82vh] flex items-center justify-center bg-[#FDFCF5] py-12 px-4 sm:px-6">
  <div class="w-full max-w-md bg-white rounded-2xl border border-[#4B3621]/15 shadow-sm p-6 sm:p-8">
    <div class="text-center mb-8">
      <img
        src="/logo.jpeg"
        alt="Kilimo Coffee and News"
        class="h-14 w-14 rounded-full object-cover mx-auto mb-3 border border-[#4B3621]/15"
      />
      <h1 class="font-serif text-2xl sm:text-3xl text-[#4B3621] mb-1">Staff &amp; Operations Portal</h1>
      <p class="text-xs sm:text-sm text-[#333333]/70">
        Sign in to publish news, manage deliveries, or administer accounts
      </p>
    </div>

    @if (errorMessage) {
      <div class="mb-5 p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs sm:text-sm">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-xs font-semibold text-[#4B3621] mb-1.5">Email Address</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          required
          placeholder="staff@kilimocoffee.co.ke"
          class="w-full px-3.5 py-2.5 rounded-lg border border-[#4B3621]/20 focus:outline-none focus:border-[#2E7D32] text-sm"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold text-[#4B3621] mb-1.5">Password</label>
        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
          placeholder="••••••••"
          class="w-full px-3.5 py-2.5 rounded-lg border border-[#4B3621]/20 focus:outline-none focus:border-[#2E7D32] text-sm"
        />
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="btn-feedback w-full py-3 rounded-lg bg-[#2E7D32] hover:bg-[#256628] disabled:opacity-60 text-white font-medium text-sm sm:text-base">
        {{ loading ? 'Signing in...' : 'Sign In to Workspace' }}
      </button>
    </form>

    <div class="mt-6 pt-5 border-t border-[#4B3621]/10 text-center">
      <a routerLink="/" class="text-xs sm:text-sm text-[#4B3621]/75 hover:text-[#2E7D32] transition-colors">
        &larr; Return to Public Website
      </a>
    </div>
  </div>
</section>
